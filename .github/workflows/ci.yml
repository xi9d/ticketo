name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon

  seed-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ticketo
          POSTGRES_USER: ticketo
          POSTGRES_PASSWORD: ticketo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketo -d ticketo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ticketo
      PGDATABASE: ticketo
      PGPASSWORD: ticketo
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f docker/postgres/seed/seed.sql
      - run: psql -v ON_ERROR_STOP=1 -f docker/postgres/seed/verify.sql